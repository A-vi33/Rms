<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reception POS</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">RMS</div>
      <nav>
        <a class="active">Reception POS</a>
        <a href="/kitchen.html" target="_blank">Kitchen (dev)</a>
      </nav>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="title">Point of Sale</div>
        <div class="actions">
          <input id="search" placeholder="Search in menu"/>
          <select id="categoryFilter"><option value="">All Categories</option></select>
          <button id="refreshBtn">Refresh Menu</button>
        </div>
      </header>

      <section class="grid" id="menuGrid"></section>
    </main>
    <aside class="order">
      <div class="order-head">
        <div>Order</div>
        <button id="clearOrder" class="link">Clear</button>
      </div>
      <div id="cartList" class="cart-list"></div>
      <div class="summary">
        <div class="row"><span>Sub total</span><span id="subTotal">₹0</span></div>
        <div class="row"><label>Discount</label><input id="discountInput" type="number" min="0" value="0"/></div>
        <div class="row"><span>Service charge</span><span id="serviceCharge">₹0</span></div>
        <div class="row"><span>CGST</span><span id="cgst">₹0</span></div>
        <div class="row"><span>SGST</span><span id="sgst">₹0</span></div>
        <div class="row"><span>IGST</span><span id="igst">₹0</span></div>
        <div class="row"><span>Round off</span><span id="roundOff">₹0</span></div>
        <div class="row total"><span>Total</span><span id="grandTotal">₹0</span></div>
      </div>
      <div class="order-actions">
        <button id="printBtn" class="secondary">Bill & Print</button>
        <button id="payBtn" class="primary">Bill & Payment</button>
      </div>
    </aside>
  </div>

  <div id="paymentModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div>Payment</div>
        <button id="closePay" class="link">Close</button>
      </div>
      <div class="modal-body">
        <div class="row"><span>Amount due</span><span id="amountDue">₹0</span></div>
        <div class="row">
          <label>Mode</label>
          <select id="payMode">
            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>
          </select>
        </div>
        <div class="row">
          <label>Paid</label>
          <input id="paidAmount" type="number" min="0" step="0.01"/>
        </div>
        <div class="row"><span>Change</span><span id="changeAmt">₹0</span></div>
        <button id="completePay" class="primary full">Complete Payment</button>
      </div>
    </div>
  </div>

  <div id="printArea" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
